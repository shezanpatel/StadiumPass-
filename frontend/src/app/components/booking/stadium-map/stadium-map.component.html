<div class="stadium-map-wrapper">
  <!-- Legend -->
  <div class="flex items-center justify-center gap-4 mb-4 flex-wrap">
    <div *ngFor="let item of [
      {color:'#22c55e', label:'Available'},
      {color:'#3b82f6', label:'Selected'},
      {color:'#ef4444', label:'Booked'},
      {color:'#eab308', label:'VIP'},
      {color:'#f97316', label:'Locked'}
    ]" class="flex items-center gap-1.5 text-xs text-sp-muted">
      <span class="w-3 h-3 rounded-full inline-block" [style.background]="item.color"></span>
      {{ item.label }}
    </div>
  </div>

  <!-- SVG Stadium Map -->
  <div class="relative flex justify-center">
    <svg
      [attr.viewBox]="'0 0 ' + SVG_WIDTH + ' ' + SVG_HEIGHT"
      class="w-full max-w-[560px] h-auto select-none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- Stadium background -->
      <defs>
        <radialGradient id="stadiumBg" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#0d2818"/>
          <stop offset="100%" stop-color="#0a0f1e"/>
        </radialGradient>
        <radialGradient id="pitchGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#16a34a"/>
          <stop offset="60%" stop-color="#15803d"/>
          <stop offset="100%" stop-color="#14532d"/>
        </radialGradient>
        <filter id="seatGlow">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <filter id="selectedGlow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Background circle -->
      <circle [attr.cx]="CX" [attr.cy]="CY" r="290" fill="url(#stadiumBg)" opacity="0.6"/>

      <!-- Section arc bands (decorative background) -->
      <path *ngFor="let section of svgSections; trackBy: trackBySection"
        [attr.d]="section.pathD"
        [attr.fill]="section.color"
        fill-opacity="0.06"
        [attr.stroke]="section.color"
        stroke-opacity="0.2"
        stroke-width="1"
      />

      <!-- Running track ring -->
      <circle [attr.cx]="CX" [attr.cy]="CY" r="87" fill="none" stroke="#854d0e" stroke-width="8" stroke-opacity="0.5"/>

      <!-- Cricket Pitch -->
      <ellipse [attr.cx]="CX" [attr.cy]="CY" rx="52" ry="52" fill="url(#pitchGrad)"/>
      <!-- Pitch strip -->
      <rect [attr.x]="CX - 8" [attr.y]="CY - 28" width="16" height="56" fill="#d4b483" opacity="0.8" rx="2"/>
      <!-- Crease lines -->
      <line [attr.x1]="CX - 10" [attr.y1]="CY - 20" [attr.x2]="CX + 10" [attr.y2]="CY - 20" stroke="white" stroke-width="1.5" opacity="0.7"/>
      <line [attr.x1]="CX - 10" [attr.y1]="CY + 20" [attr.x2]="CX + 10" [attr.y2]="CY + 20" stroke="white" stroke-width="1.5" opacity="0.7"/>
      <!-- Stadium Pass logo center -->
      <text [attr.x]="CX" [attr.y]="CY - 8" text-anchor="middle" fill="white" font-size="9" font-weight="700" opacity="0.9" font-family="Rajdhani, sans-serif">STADIUM</text>
      <text [attr.x]="CX" [attr.y]="CY + 6" text-anchor="middle" fill="#eab308" font-size="9" font-weight="700" opacity="0.9" font-family="Rajdhani, sans-serif">PASS</text>

      <!-- Seats for each section -->
      <g *ngFor="let section of svgSections; trackBy: trackBySection">
        <circle
          *ngFor="let seat of section.seats; trackBy: trackBySeat"
          [attr.cx]="seat.cx"
          [attr.cy]="seat.cy"
          [attr.r]="seat.status === 'selected' ? SEAT_RADIUS + 1.5 : SEAT_RADIUS"
          [attr.fill]="getSeatColor(seat)"
          [attr.opacity]="getSeatOpacity(seat)"
          [attr.cursor]="getSeatCursor(seat)"
          [attr.filter]="seat.status === 'selected' ? 'url(#selectedGlow)' : ''"
          [attr.stroke]="seat.status === 'selected' ? 'white' : 'none'"
          [attr.stroke-width]="seat.status === 'selected' ? '1.5' : '0'"
          class="transition-all duration-150"
          (click)="onSeatClick(seat, $event)"
          (mouseenter)="onSeatHover(seat, $event)"
          (mouseleave)="onSeatLeave()"
        />
      </g>

      <!-- Section labels -->
      <text *ngFor="let section of svgSections; trackBy: trackBySection"
        [attr.x]="section.labelX" [attr.y]="section.labelY"
        text-anchor="middle" dominant-baseline="middle"
        [attr.fill]="section.color"
        font-size="12" font-weight="700" font-family="Rajdhani, sans-serif"
        letter-spacing="1"
      >{{ section.displayName | uppercase }}</text>

      <!-- Compass directions -->
      <text [attr.x]="CX" y="18" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Rajdhani">N</text>
      <text [attr.x]="CX" [attr.y]="SVG_HEIGHT - 8" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Rajdhani">S</text>
      <text x="14" [attr.y]="CY + 4" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Rajdhani">W</text>
      <text [attr.x]="SVG_WIDTH - 14" [attr.y]="CY + 4" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="Rajdhani">E</text>
    </svg>

    <!-- Tooltip -->
    <div *ngIf="hoveredSeat"
      class="absolute z-50 bg-sp-dark border border-sp-border rounded-xl p-3 shadow-glass pointer-events-none min-w-[140px] text-sm"
      [style.left.px]="tooltipX"
      [style.top.px]="tooltipY"
    >
      <p class="font-display font-bold text-sp-text">Seat {{ hoveredSeat.seatId }}</p>
      <p class="text-sp-muted text-xs capitalize">{{ hoveredSeat.tier }} · Row {{ hoveredSeat.row }}</p>
      <p class="text-sp-green font-bold mt-1">₹{{ hoveredSeat.price | number }}</p>
    </div>
  </div>

  <!-- Selection Summary -->
  <div *ngIf="selectedSeats.length > 0"
    class="mt-4 bg-sp-surface border border-sp-border rounded-2xl p-4 animate-slide-up">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-display font-bold text-sp-text text-lg">Selected Seats ({{ selectedSeats.length }})</h3>
      <button (click)="clearSelection()" class="text-sp-muted hover:text-sp-red text-xs transition-colors">Clear All</button>
    </div>
    <div class="flex flex-wrap gap-2 mb-3">
      <span *ngFor="let s of selectedSeats"
        class="px-2.5 py-1 bg-sp-blue/20 border border-sp-blue/40 text-sp-blue rounded-lg text-xs font-mono font-bold">
        {{ s.seatId }}
      </span>
    </div>
    <div class="flex justify-between items-center border-t border-sp-border pt-3">
      <span class="text-sp-muted text-sm">Total</span>
      <span class="font-display font-bold text-sp-green text-xl">₹{{ totalPrice | number }}</span>
    </div>
  </div>
</div>
