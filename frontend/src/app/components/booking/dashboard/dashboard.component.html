<div class="min-h-screen bg-stadium-gradient pt-6 px-4 pb-16">
  <div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="mb-8 animate-fade-in">
      <h1 class="font-display font-black text-4xl text-sp-text tracking-wide">
        UPCOMING <span class="text-sp-green">MATCHES</span>
      </h1>
      <p class="text-sp-muted mt-1">Book your seats for the best cricket action</p>
    </div>

    <!-- Filters -->
    <form [formGroup]="filterForm" class="bg-sp-glass backdrop-blur-glass border border-sp-border rounded-2xl p-4 mb-8 animate-fade-in">
      <div class="flex flex-wrap gap-3 items-end">
        <!-- Tournament -->
        <div class="flex-1 min-w-[160px]">
          <label class="block text-sp-muted text-xs uppercase tracking-wider mb-1.5">Tournament</label>
          <select formControlName="tournament"
            class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-2.5 text-sp-text text-sm outline-none focus:border-sp-green transition-colors">
            <option value="">All Tournaments</option>
            <option *ngFor="let t of tournaments" [value]="t">{{ t }}</option>
          </select>
        </div>
        <!-- Team Search -->
        <div class="flex-1 min-w-[160px]">
          <label class="block text-sp-muted text-xs uppercase tracking-wider mb-1.5">Team</label>
          <input formControlName="team" type="text" placeholder="Search team..."
            class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-2.5 text-sp-text text-sm outline-none focus:border-sp-green transition-colors placeholder-sp-muted/40"/>
        </div>
        <!-- Status -->
        <div class="flex-1 min-w-[140px]">
          <label class="block text-sp-muted text-xs uppercase tracking-wider mb-1.5">Status</label>
          <select formControlName="status"
            class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-2.5 text-sp-text text-sm outline-none focus:border-sp-green transition-colors">
            <option value="">All</option>
            <option *ngFor="let s of statuses" [value]="s">{{ s | titlecase }}</option>
          </select>
        </div>
        <!-- Clear -->
        <button type="button" (click)="clearFilters()"
          class="px-5 py-2.5 rounded-xl border border-sp-border text-sp-muted hover:text-sp-text hover:border-sp-green text-sm transition-all font-semibold">
          Clear
        </button>
      </div>
    </form>

    <!-- Skeleton Loaders -->
    <div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let i of [1,2,3,4,5,6]" class="bg-sp-dark border border-sp-border rounded-2xl overflow-hidden">
        <div class="h-40 skeleton-shimmer rounded-t-2xl"></div>
        <div class="p-5 space-y-3">
          <div class="h-4 skeleton-shimmer rounded-lg w-3/4"></div>
          <div class="h-3 skeleton-shimmer rounded-lg w-1/2"></div>
          <div class="h-3 skeleton-shimmer rounded-lg w-2/3"></div>
          <div class="h-10 skeleton-shimmer rounded-xl mt-4"></div>
        </div>
      </div>
    </div>

    <!-- Match Cards Grid -->
    <div *ngIf="!isLoading">
      <div *ngIf="matches.length === 0" class="text-center py-24">
        <div class="text-6xl mb-4">🏟️</div>
        <h3 class="font-display font-bold text-xl text-sp-text mb-2">No Matches Found</h3>
        <p class="text-sp-muted">Try adjusting your filters</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <app-match-card *ngFor="let match of matches" [match]="match" class="animate-slide-up"/>
      </div>
    </div>

    <!-- Pagination -->
    <div *ngIf="!isLoading && totalPages > 1" class="flex justify-center gap-2 mt-10">
      <button *ngFor="let p of pages" (click)="changePage(p)"
        [class]="p === currentPage
          ? 'w-10 h-10 rounded-xl bg-sp-green text-white font-bold text-sm shadow-glow-green'
          : 'w-10 h-10 rounded-xl border border-sp-border text-sp-muted hover:border-sp-green hover:text-sp-text text-sm transition-all'">
        {{ p }}
      </button>
    </div>
  </div>
</div>
