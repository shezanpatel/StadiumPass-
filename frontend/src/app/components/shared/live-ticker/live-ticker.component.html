<div class="bg-sp-darker border-b border-sp-border/50 overflow-hidden" style="height:32px">
  <div class="flex items-center h-full">
    <div class="flex-shrink-0 px-3 bg-sp-red flex items-center gap-1.5 h-full">
      <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>
      <span class="text-white text-xs font-display font-bold tracking-wider">LIVE</span>
    </div>
    <div class="overflow-hidden flex-1 relative">
      <div class="whitespace-nowrap text-sp-muted text-xs animate-ticker inline-block">
        {{ tickerText }}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{{ tickerText }}
      </div>
    </div>
  </div>
</div>
