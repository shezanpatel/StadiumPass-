<div class="min-h-screen bg-stadium-gradient flex items-center justify-center px-4 py-12">
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/3 right-1/4 w-80 h-80 bg-sp-gold/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/3 left-1/4 w-64 h-64 bg-sp-green/5 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-md relative z-10 animate-fade-in">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-green-gradient flex items-center justify-center shadow-glow-green">
          <span class="text-white text-2xl">🏏</span>
        </div>
        <h1 class="font-display font-black text-2xl text-sp-text tracking-wider">STADIUM<span class="text-sp-green">PASS</span></h1>
      </a>
    </div>

    <div class="bg-sp-glass backdrop-blur-glass border border-sp-border rounded-3xl p-8 shadow-glass">
      <h2 class="font-display font-bold text-2xl text-sp-text mb-1">Create Account</h2>
      <p class="text-sp-muted text-sm mb-6">Join thousands of cricket fans</p>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate class="space-y-4">
        <div>
          <label class="block text-sp-muted text-xs font-semibold uppercase tracking-wider mb-1.5">Full Name</label>
          <input formControlName="name" type="text" placeholder="Virat Kohli"
            class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-3 text-sp-text placeholder-sp-muted/40 outline-none text-sm focus:border-sp-green transition-colors"/>
          <p *ngIf="field('name').invalid && field('name').touched" class="text-sp-red text-xs mt-1">{{ getError('name') }}</p>
        </div>

        <div>
          <label class="block text-sp-muted text-xs font-semibold uppercase tracking-wider mb-1.5">Email</label>
          <input formControlName="email" type="email" placeholder="you@example.com"
            class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-3 text-sp-text placeholder-sp-muted/40 outline-none text-sm focus:border-sp-green transition-colors"/>
          <p *ngIf="field('email').invalid && field('email').touched" class="text-sp-red text-xs mt-1">{{ getError('email') }}</p>
        </div>

        <div>
          <label class="block text-sp-muted text-xs font-semibold uppercase tracking-wider mb-1.5">Phone (optional)</label>
          <input formControlName="phone" type="tel" placeholder="9876543210"
            class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-3 text-sp-text placeholder-sp-muted/40 outline-none text-sm focus:border-sp-green transition-colors"/>
          <p *ngIf="field('phone').invalid && field('phone').touched" class="text-sp-red text-xs mt-1">{{ getError('phone') }}</p>
        </div>

        <div>
          <label class="block text-sp-muted text-xs font-semibold uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••"
              class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-3 pr-12 text-sp-text placeholder-sp-muted/40 outline-none text-sm focus:border-sp-green transition-colors"/>
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-sp-muted">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
          <p *ngIf="field('password').invalid && field('password').touched" class="text-sp-red text-xs mt-1">{{ getError('password') }}</p>
        </div>

        <div>
          <label class="block text-sp-muted text-xs font-semibold uppercase tracking-wider mb-1.5">Confirm Password</label>
          <input formControlName="confirmPassword" type="password" placeholder="••••••••"
            class="w-full bg-sp-darker border border-sp-border rounded-xl px-4 py-3 text-sp-text placeholder-sp-muted/40 outline-none text-sm focus:border-sp-green transition-colors"/>
          <p *ngIf="passwordMismatch" class="text-sp-red text-xs mt-1">Passwords do not match.</p>
        </div>

        <button type="submit" [disabled]="isLoading"
          class="w-full py-3.5 mt-2 rounded-xl font-display font-bold text-base tracking-wider transition-all bg-green-gradient text-white shadow-glow-green hover:shadow-none hover:scale-[0.98] disabled:opacity-60">
          {{ isLoading ? 'Creating Account...' : 'CREATE ACCOUNT' }}
        </button>
      </form>

      <p class="text-center text-sp-muted text-sm mt-5">
        Already have an account?
        <a routerLink="/login" class="text-sp-green hover:text-sp-green-light font-semibold ml-1">Sign in</a>
      </p>
    </div>
  </div>
</div>
